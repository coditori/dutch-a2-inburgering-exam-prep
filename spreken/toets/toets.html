<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spreken – toets</title>
<link rel="stylesheet" href="../../shared/app.css">
<script src="../../shared/thema.js"></script>
<link rel="stylesheet" href="../../spreken/spreken.css">
</head>
<body>
<div id="pagina"><main><p class="zacht">Even wachten…</p></main></div>
<script src="../../shared/woorden.js"></script>
<script src="../../shared/srs.js"></script>
<script src="../../shared/audio.js"></script>
<script src="../../shared/app.js"></script>
<script src="../../spreken/spreken.js"></script>
<script>
// Toets in de vorm van het examen: 16 vragen in 4 onderdelen, 35 minuten. U mag opnieuw luisteren, opnieuw opnemen en terug.
// toets.html?t=A laadt A.json. De klok en de plek blijven bewaard als de pagina opnieuw laadt; de opnames zelf niet.
(async () => {
  const { el } = App;
  const MINUTEN = 35;
  const ONDERDEEL = {
    1: ['Onderdeel 1 - vragen met een video', 'Op het examen vraagt een man of vrouw iets in een video. Hier hoort u alleen de stem. U moet antwoord geven.'],
    2: ['Onderdeel 2 - vragen met 1 plaatje', 'U ziet vier vragen met één plaatje. Geef antwoord op de vragen. Gebruik steeds het plaatje.'],
    3: ['Onderdeel 3 - vragen met 2 plaatjes', 'U ziet vier vragen met twee plaatjes. Geef antwoord op de vragen. U kiest steeds één plaatje.'],
    4: ['Onderdeel 4 - vragen met 3 plaatjes', 'U ziet vier vragen met drie plaatjes. Vertel iets bij elk plaatje.'],
  };
  const id = new URLSearchParams(location.search).get('t') || 'A';
  const pagina = document.getElementById('pagina');
  await Spraak.map('../audio/');
  let toets;
  try { toets = await Spreken.json(`${id}.json`); } catch (e) { pagina.textContent = 'Deze toets bestaat niet: ' + id; return; }
  const kop = App.kop(`Spreken · ${toets.titel}`, '../index.html');
  const klok = el('b', { class: 'klok' });
  kop.insertBefore(klok, kop.lastChild);
  const vragen = toets.items;
  const opnames = {}; // nr -> { url, tekst } (alleen in het geheugen)

  let stand = App.lees('spreken-toets-bezig', null);
  if (!stand || stand.id !== id) stand = null;
  const bewaar = () => App.schrijf('spreken-toets-bezig', stand);
  let tik = null;
  const rest = () => Math.max(0, MINUTEN * 60 - Math.floor((Date.now() - stand.start) / 1000));
  function tekenKlok() { const s = rest(); klok.textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s <= 0) inleveren(); }

  function welkom() {
    pagina.textContent = ''; klok.textContent = '';
    const eerder = Spreken.P.toets[id] || [];
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0' }, `Welkom bij ${toets.titel}`),
      el('p', {}, `De toets heeft ${vragen.length} vragen in vier onderdelen: vragen met een video, met 1 plaatje, met 2 plaatjes en met 3 plaatjes. U mag ${MINUTEN} minuten over de toets doen.`),
      el('p', { class: 'zacht', en: 'You may listen again, record again and go back. Always answer both parts of the question. At the end you check each answer with the model.' },
        'U mag opnieuw luisteren, opnieuw opnemen en terug gaan. Geef altijd antwoord op de twee delen van de vraag. Aan het einde controleert u elk antwoord met het voorbeeld.'),
      eerder.length ? el('p', { class: 'zacht klein' }, 'Eerder: ' + eerder.map((r) => `${r.score}/${r.totaal} (${r.datum})`).join(' · ')) : null,
      el('div', { class: 'knoppen' }, el('button', { class: 'knop', onclick: () => { stand = { id, start: Date.now(), nu: 0, gedaan: {}, goed: {} }; bewaar(); examen(); } }, 'Start')))));
  }

  function examen() { clearInterval(tik); tik = setInterval(tekenKlok, 1000); tekenKlok(); if (!stand.klaar) teken(); }

  function teken() {
    Spraak.stop();
    const nr = stand.nu, it = vragen[nr];
    const eersteVanDeel = nr === 0 || vragen[nr - 1].deel !== it.deel;
    const tekst = el('div', { hidden: it.deel === 1 }, it.sit ? el('p', {}, it.sit) : null, el('p', { class: 'spreekvraag' }, it.vraag));
    const hint = { 2: 'Gebruik het plaatje.', 3: 'Kies een van de plaatjes.', 4: 'Gebruik alle plaatjes.' }[it.deel];
    const opnameVak = el('div');
    let rec = null;
    const knop = el('button', { class: 'knop' }, opnames[nr] ? '⏺ Opnieuw opnemen' : '⏺ Opnemen');
    const status = el('span', { class: 'zacht klein' }, stand.gedaan[nr] ? '✔ antwoord gegeven' : '');
    const speler = el('div', {}, opnames[nr] ? el('audio', { controls: true, src: opnames[nr].url }) : null);
    knop.addEventListener('click', async () => {
      if (rec) {
        knop.disabled = true; status.textContent = 'even wachten…';
        const r = rec; rec = null;
        opnames[nr] = await r.stop();
        stand.gedaan[nr] = true; bewaar();
        knop.disabled = false; knop.classList.remove('rood', 'bezig'); knop.textContent = '⏺ Opnieuw opnemen'; status.textContent = '✔ antwoord gegeven';
        speler.textContent = ''; speler.append(el('audio', { controls: true, src: opnames[nr].url }));
        return;
      }
      Spraak.stop();
      try { rec = await Spreken.opnemer(); knop.textContent = '⏹ Stop'; knop.classList.add('rood', 'bezig'); status.textContent = 'opname loopt…'; }
      catch (e) { status.textContent = 'Geen microfoon: zeg uw antwoord hardop en klik op "Hardop gezegd".'; }
    });
    const hardop = el('button', { class: 'knop licht klein', en: 'no microphone: I said it aloud', onclick: () => { stand.gedaan[nr] = true; bewaar(); status.textContent = '✔ antwoord gegeven'; } }, 'Hardop gezegd');
    opnameVak.append(el('div', { class: 'opname' }, knop, hardop, status), speler);
    pagina.textContent = '';
    pagina.append(el('div', { class: 'examen' },
      el('section', {},
        eersteVanDeel ? el('div', { class: 'lees-eerst' }, el('b', {}, ONDERDEEL[it.deel][0]), el('p', { class: 'zacht' }, ONDERDEEL[it.deel][1])) : el('p', { class: 'zacht klein' }, ONDERDEEL[it.deel][0]),
        Spreken.scene(it.beelden),
        it.deel === 1 ? el('div', { class: 'scene' }, el('div', { class: 'plaat' }, '🧑‍💼🎥')) : null),
      el('section', {}, tekst, hint ? el('p', { class: 'zacht' }, hint) : null,
        el('div', { class: 'knoppen' }, el('button', { class: 'knop licht', en: 'listen again', onclick: () => Spreken.speel(Spreken.vraagTekst(it)) }, '🔊 Luister naar de vraag')),
        opnameVak)),
      el('div', { class: 'voet' },
        el('button', { class: 'knop', disabled: nr === 0, onclick: () => ga(nr - 1) }, '‹ Vorige'),
        el('span', {}, el('b', {}, `${nr + 1} / ${vragen.length}`), ' ', el('button', { class: 'knop klein', en: 'overview', onclick: overzicht }, '▦ Overzicht')),
        nr < vragen.length - 1 ? el('button', { class: 'knop', onclick: () => ga(nr + 1) }, 'Volgende ›') : el('button', { class: 'knop', en: 'hand in', onclick: overzicht }, 'Inleveren')));
    Spreken.speel(Spreken.vraagTekst(it));
    window.scrollTo(0, 0);
  }
  function ga(n) { stand.nu = n; bewaar(); teken(); }

  function overzicht() {
    Spraak.stop();
    const open = vragen.filter((_, i) => !stand.gedaan[i]).length;
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0' }, 'Overzicht'),
      el('p', {}, open ? `U hebt op ${open} ${open === 1 ? 'vraag' : 'vragen'} nog geen antwoord gegeven.` : 'U hebt op alle vragen antwoord gegeven.'),
      el('div', { class: 'raster' }, vragen.map((_, i) => el('button', { class: stand.gedaan[i] ? 'af' : '', onclick: () => ga(i) }, String(i + 1)))),
      el('div', { class: 'knoppen' }, el('button', { class: 'knop licht', onclick: teken }, 'Terug naar de vraag'), el('button', { class: 'knop', en: 'hand in and check your answers', onclick: inleveren }, 'Inleveren')))));
  }

  function inleveren() {
    if (stand.klaar) return;
    clearInterval(tik);
    stand.klaar = true; stand.sec = Math.min(MINUTEN * 60, Math.floor((Date.now() - stand.start) / 1000)); stand.kijk = 0;
    bewaar(); nakijken();
  }

  // na de toets: elk antwoord naast het voorbeeld leggen
  function nakijken() {
    Spraak.stop(); klok.textContent = '';
    const nr = stand.kijk;
    pagina.textContent = '';
    if (nr >= vragen.length) return uitslag();
    const it = vragen[nr], p = Spreken.punten(it), o = opnames[nr];
    const vakjes = p.punten.map((x) => { const i = el('input', { type: 'checkbox' }); return { i, rij: el('label', { en: x.en }, i, x.tekst) }; });
    if (o && o.tekst) p.auto(o.tekst).forEach((ok, i) => { vakjes[i].i.checked = ok; });
    pagina.append(el('main', {}, el('p', { class: 'zacht klein' }, `Nakijken: vraag ${nr + 1} van ${vragen.length}`), el('div', { class: 'kaart' },
      Spreken.scene(it.beelden), it.sit ? el('p', {}, App.woorden(it.sit)) : null, el('p', { class: 'spreekvraag' }, App.woorden(it.vraag)),
      !stand.gedaan[nr] ? el('p', { class: 'uitslag fout' }, 'Geen antwoord gegeven.') : null,
      o ? el('p', {}, 'Uw opname: ', el('audio', { controls: true, src: o.url })) : stand.gedaan[nr] ? el('p', { class: 'tip', en: 'The recording is gone (page reloaded) or you answered without microphone.' }, 'Er is geen opname meer. Controleer uit uw hoofd.') : null,
      o && o.tekst ? el('div', { class: 'gehoord' }, el('span', { class: 'zacht klein' }, 'De computer hoorde: '), o.tekst) : null,
      el('div', { class: 'lijstje' }, vakjes.map((v) => v.rij)),
      el('div', { class: 'model' }, el('p', { class: 'zacht klein', en: 'model answer' }, 'Voorbeeld:'), p.model.map((z) => el('p', {}, App.woorden(z))),
        el('button', { class: 'knop licht klein', onclick: () => Spreken.speel(p.model) }, '🔊 Luister')),
      el('div', { class: 'knoppen' }, el('button', { class: 'knop', en: 'next', onclick: () => {
        stand.goed[nr] = !!stand.gedaan[nr] && vakjes.every((v) => v.i.checked);
        if (!stand.goed[nr] && it.les) Spreken.terug.fout(it.les);
        stand.kijk++; bewaar(); nakijken();
      } }, 'Verder')))));
    window.scrollTo(0, 0);
  }

  function uitslag() {
    const score = vragen.filter((_, i) => stand.goed[i]).length;
    if (!stand.geteld) {
      (Spreken.P.toets[id] = Spreken.P.toets[id] || []).push({ score, totaal: vragen.length, datum: new Date().toISOString().slice(0, 10), sec: stand.sec });
      Spreken.bewaar(); stand.geteld = true; bewaar();
    }
    const ok = score >= 13;
    pagina.append(el('main', {}, el('div', { class: 'kaart midden' },
      el('div', { class: 'groot' }, `${score} / ${vragen.length}`),
      el('p', { class: 'uitslag ' + (ok ? 'goed' : 'fout'), en: 'Your own check against the model answers. A real examiner also judges grammar and pronunciation.' }, ok ? '✔ Op de meeste vragen gaf u twee goede antwoorden.' : 'Let op: geef op elke vraag antwoord op de twee delen.'),
      el('p', { class: 'zacht klein' }, `Tijd: ${Math.floor(stand.sec / 60)} minuten. Dit is uw eigen controle. Op het examen kijkt een mens ook naar grammatica en uitspraak.`),
      el('div', { class: 'raster' }, vragen.map((_, i) => el('button', { class: stand.goed[i] ? 'goed' : 'fout', disabled: true }, String(i + 1)))),
      el('div', { class: 'knoppen', style: 'justify-content:center' },
        el('button', { class: 'knop licht', en: 'again', onclick: () => { stand = null; App.schrijf('spreken-toets-bezig', null); welkom(); } }, 'Nog een keer'),
        el('a', { class: 'knop', href: '../index.html' }, 'Naar de lessen')))));
  }

  if (!stand) welkom(); else if (stand.klaar) nakijken(); else examen();
})();
</script>
</body>
</html>
