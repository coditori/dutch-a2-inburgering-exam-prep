<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lezen: valwoorden</title>
<link rel="stylesheet" href="../../shared/app.css">
<script src="../../shared/thema.js"></script>
</head>
<body>
<main><div id="pagina"></div></main>
<script src="../../shared/woorden.js"></script>
<script src="../../shared/srs.js"></script>
<script src="../../shared/audio.js"></script>
<script src="../../shared/app.js"></script>
<script src="../lezen.js"></script>
<script>
// Valwoorden-trainer: twee bijna dezelfde zinnen. Bij welke zin hoort de uitspraak? Inhoud: valwoorden.json
(async () => {
  const { el } = App;
  const data = await Lezen.json('valwoorden.json');
  Lezen.ronde({
    id: 'valwoorden', titel: 'Valwoorden', na: data.na, items: data.items, n: 10,
    uitleg: 'U ziet twee zinnen: A en B. Eén klein woord is anders. Bij welke zin past de zin eronder?', uitlegEn: 'Two sentences, one small word differs. Which sentence matches the statement below?',
    teken(doel, item, klaar) {
      const om = Math.random() < 0.5; // A en B soms omdraaien
      const zinnen = om ? [item.b, item.a] : [item.a, item.b];
      const goed = (item.goed === 'a') !== om ? 0 : 1;
      const knoppen = zinnen.map((z, i) => el('button', { class: 'optie', onclick: () => {
        knoppen.forEach((k, j) => { k.disabled = true; if (j === goed) k.classList.add('goed'); });
        if (i !== goed) knoppen[i].classList.add('fout');
        klaar(i === goed, el('p', { class: 'zacht' }, 'Let op het woord: ', el('span', { class: 'gatwoord' }, item.val)));
      } }, el('span', { class: 'l' }, 'AB'[i]), el('span', {}, z)));
      doel.append(el('div', { class: 'opties' }, knoppen), el('p', { class: 'v', style: 'font-weight:700;margin-top:16px' }, 'Wat past? ', App.woorden(item.v)));
    },
  });
})();
</script>
</body>
</html>
