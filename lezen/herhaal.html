<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lezen: herhalen</title>
<link rel="stylesheet" href="../shared/app.css">
<script src="../shared/thema.js"></script>
</head>
<body>
<main><div id="pagina"></div></main>
<script src="../shared/woorden.js"></script>
<script src="../shared/srs.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/app.js"></script>
<script>
// Herhalen met Leitner-dozen: woorden en zinnen met een gat.
// Een woordkaart vraagt altijd een antwoord dat de pagina zelf nakijkt (niet: "wist ik het?"). Zo werkt het:
// Een kaart is nooit alleen een woord: er staat een plaatje bij en een korte zin uit de les (als het woord die heeft), en u hoort het woord.
//   nieuw woord        -> eerst leren: woord, plaatje, zin, betekenis en geluid. Daarna komt het in dezelfde ronde als vraag.
//   vak 0 en 1         -> kiezen: u ziet het Nederlandse woord en kiest het plaatje of de betekenis (herkennen)
//   vak 2 en hoger     -> typen: u ziet het plaatje en de betekenis en typt het Nederlandse woord (zelf maken: dat is moeilijker en blijft beter hangen)
// Na elk antwoord: het goede antwoord met plaatje, betekenis en geluid. Fout? Dan komt de kaart in deze ronde nog een keer terug.
(() => {
  const { el } = App;
  App.kop('Herhalen', 'index.html');
  const pagina = document.getElementById('pagina');
  let rij = [], goed = 0, gedaan = 0, totaal = 0;

  function start(kaarten) {
    rij = App.schud(kaarten).slice(0, 20);
    goed = 0; gedaan = 0; totaal = rij.length;
    volgende();
  }

  function begin() {
    pagina.textContent = '';
    const nu = SRS.aanDeBeurt();
    const tel = SRS.tel();
    const stand = App.tredeStand();
    pagina.append(
      el('div', { class: 'kaart' },
        el('h3', {}, `Vandaag: ${nu.length} ${nu.length === 1 ? 'kaart' : 'kaarten'}`),
        el('p', { class: 'zacht', en: 'You see a word and choose what it means. Do you know a word well? Then you type it yourself. You always see the right answer.' },
          'U ziet een woord en kiest wat het betekent. Kent u een woord al goed? Dan typt u het zelf. U ziet altijd het goede antwoord.'),
        el('p', { class: 'zacht klein uitleg', 'data-knop': 'Hoe werkt herhalen?', 'data-knop-en': 'how does reviewing work?', en: 'Wrong: the word comes again in this round, and tomorrow. Right: back in 2, 4, 8, 16 days.' }, 'Fout: het woord komt in deze ronde nog een keer, en morgen weer. Goed: terug over 2, 4, 8, 16 dagen.'),
        el('div', { class: 'knoppen' },
          el('button', { class: 'knop', disabled: !nu.length, en: 'start', onclick: () => start(nu) }, 'Begin'),
          el('button', { class: 'knop licht', en: '10 new words from the list', onclick: nieuweWoorden }, '+ 10 nieuwe woorden'),
          tel.totaal && !nu.length ? el('button', { class: 'knop licht', en: 'practise anyway', onclick: () => start(Object.entries(SRS.alle()).map(([id, k]) => Object.assign({ id, extra: true }, k))) }, 'Toch nu oefenen') : null)),
      el('h2', { en: 'words you know, per step' }, 'Woorden die u kent'),
      el('table', { class: 'ladder' }, stand.map((s, t) => el('tr', {},
        el('td', {}, `Trede ${t}`),
        el('td', { style: 'width:50%' }, el('div', { class: 'balk' }, el('i', { style: `width:${s.totaal ? Math.round(100 * s.bekend / s.totaal) : 0}%` }))),
        el('td', { class: 'klein zacht' }, `${s.bekend} van ${s.totaal}, bezig met ${s.bezig}`)))),
      el('p', { class: 'klein zacht', en: 'A word counts as known after two right answers on two different days.' }, 'Een woord telt als gekend na twee goede antwoorden op twee dagen.'));
    App.uitleg(pagina);
  }

  // de volgende 10 woorden van de laagste trede die nog niet in de dozen zitten
  function nieuweWoorden() {
    const kaarten = SRS.alle();
    const nieuw = [];
    for (let t = 1; t <= 4 && nieuw.length < 10; t++) {
      for (const r of App.W.lijst) {
        if (nieuw.length >= 10) break;
        if (r[0] !== t || (r[3] === 'werkwoord' && t > 2) || kaarten['w:' + r[1]]) continue;
        SRS.voegToe('w:' + r[1], { soort: 'w', nl: r[1] }, true);
        nieuw.push({ id: 'w:' + r[1], soort: 'w', nl: r[1], box: 0, nieuw: true });
      }
    }
    if (nieuw.length) start(nieuw); else begin();
  }

  function volgende() {
    pagina.textContent = '';
    const k = rij.shift();
    if (!k) {
      pagina.append(el('div', { class: 'kaart midden' },
        el('div', { class: 'groot' }, `${goed} / ${gedaan}`),
        el('p', { en: 'Done for today.' }, 'Klaar voor vandaag.'),
        el('div', { class: 'knoppen', style: 'justify-content:center' },
          el('button', { class: 'knop licht', onclick: begin }, 'Terug'),
          el('a', { class: 'knop', href: 'index.html' }, 'Naar de lessen'))));
      return;
    }
    pagina.append(el('div', { class: 'balk', style: 'margin-bottom:6px' }, el('i', { style: `width:${totaal ? Math.round(100 * gedaan / totaal) : 0}%` })),
      el('p', { class: 'zacht klein' }, `nog ${rij.length + 1}`));
    // Het eerste antwoord telt (voor de uitslag en voor het vak). Fout? Dan komt de kaart aan het einde van de ronde terug, tot het goed is.
    const klaar = (ok) => {
      if (!k.herkans) { gedaan++; if (ok) goed++; if (!k.extra) SRS.antwoord(k.id, ok); }
      if (!ok) rij.push(Object.assign({}, k, { herkans: true, geleerd: true }));
      volgende();
    };
    if (k.soort === 'z') zinKaart(k, klaar); else woordKaart(k, klaar);
  }

  const WL = App.W.lijst;
  // 'de koffie / de thee' -> ['koffie', 'thee']: elk van de vormen is goed, met of zonder lidwoord, zonder leestekens en hoofdletters
  const kort = (t) => App.kaal(t).replace(/[.?!,]/g, '').replace(/\s+/g, ' ').trim().replace(/^(de|het|een) /, '');
  const vormen = (nl) => nl.split(/\s+\/\s+|,\s+/).map(kort).filter(Boolean);

  // de voorbeeldzin van het woord (uit de les), met een knop om hem te horen. Geen zin? Dan niets.
  const zinRegel = (r) => (r[6] ? el('p', { class: 'kaart-zin' }, el('span', {}, r[6]), ' ', el('button', { class: 'rond', title: 'luister naar de zin', 'aria-label': 'luister naar de zin', onclick: () => Spraak.zeg(r[6]) }, '🔊')) : null);

  // na het antwoord: goed of fout, en altijd het woord met plaatje, betekenis en geluid
  function nakijken(k, r, ok, klaar, uit, zinStaatEr) { // zinStaatEr: de zin stond al bij de vraag
    Spraak.zeg(k.nl);
    const verder = el('button', { class: 'knop', en: 'next', onclick: () => klaar(ok) }, 'Verder');
    uit.textContent = '';
    uit.append(...[ // een lege waarde (geen zin) mag niet als tekst op de pagina komen
      el('p', { class: 'uitslag ' + (ok ? 'goed' : 'fout'), en: ok ? 'right' : 'not right: this word comes back' }, ok ? '✔ Goed!' : '✘ Niet goed. Dit woord komt terug.'),
      el('div', { class: 'kaart-antwoord' },
        r[4] ? el('div', { class: 'beeld', 'aria-hidden': 'true' }, r[4]) : null,
        el('div', {},
          el('b', {}, k.nl, ' ', el('button', { class: 'rond', title: 'luister', 'aria-label': 'luister', onclick: () => Spraak.zeg(k.nl) }, '🔊')),
          el('div', { class: 'zacht', style: 'font-style:italic', hulp: r[2] }),
          r[5] ? el('div', { class: 'klein zacht' }, r[5]) : null)),
      zinStaatEr ? null : zinRegel(r),
      el('div', { class: 'knoppen', style: 'justify-content:center' }, verder)].filter(Boolean));
    verder.focus();
    if (ok) App.goed(verder);
  }

  function woordKaart(k, klaar) {
    const nr = App.lemmaNr(k.nl), r = WL[nr];
    if (!r) return losseKaart(k, klaar); // een woord dat niet (meer) in de woordenlijst staat
    // een nieuw woord leert u eerst; de vraag komt daarna, in dezelfde ronde
    if (k.nieuw && !k.geleerd) {
      Spraak.zeg(k.nl);
      pagina.append(el('div', { class: 'kaart midden' },
        el('p', { class: 'zacht', en: 'a new word: look, listen and say it' }, 'Een nieuw woord. Kijk, luister en zeg het na.'),
        r[4] ? el('div', { class: 'beeld', style: 'font-size:3.4rem;line-height:1.2', 'aria-hidden': 'true' }, r[4]) : null,
        el('div', { class: 'groot' }, k.nl, ' ', el('button', { class: 'rond', title: 'luister', 'aria-label': 'luister', onclick: () => Spraak.zeg(k.nl) }, '🔊')),
        el('p', { class: 'zacht', style: 'font-style:italic', hulp: r[2] }),
        r[5] ? el('p', { class: 'klein zacht' }, r[5]) : null,
        zinRegel(r),
        el('div', { class: 'knoppen', style: 'justify-content:center' },
          el('button', { class: 'knop', en: 'next', onclick: () => { rij.push(Object.assign({}, k, { geleerd: true })); totaal++; gedaan++; volgende(); } }, 'Verder'))));
      return;
    }
    const uit = el('div');
    // ----- typen (vak 2 en hoger): van plaatje en betekenis naar het Nederlandse woord -----
    if (k.box >= 2 && !k.herkans) {
      const goede = vormen(r[1]);
      const invoer = el('input', { class: 'gat', style: 'width:min(16em,100%)', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'het Nederlandse woord' });
      const stuur = () => { if (invoer.disabled) return; invoer.disabled = true; knoppen.remove(); nakijken(k, r, goede.includes(kort(invoer.value)), klaar, uit); };
      const knoppen = el('div', { class: 'knoppen', style: 'justify-content:center' },
        el('button', { class: 'knop', en: 'check', onclick: stuur }, 'Controleer'),
        el('button', { class: 'knop licht', en: 'first letter', onclick: () => { invoer.value = r[1].replace(/^(de|het|een) /, '')[0]; invoer.focus(); } }, 'Eerste letter'));
      invoer.addEventListener('keydown', (e) => { if (e.key === 'Enter') stuur(); });
      pagina.append(el('div', { class: 'kaart midden' },
        el('p', { class: 'zacht', en: 'You know this word. Type it in Dutch.' }, 'Dit woord kent u al. Typ het in het Nederlands.'),
        r[4] ? el('div', { class: 'beeld', style: 'font-size:3.4rem;line-height:1.2', 'aria-hidden': 'true' }, r[4]) : null,
        el('p', { style: 'font-size:1.2rem;font-style:italic', hulp: r[2] }),
        el('p', {}, invoer), knoppen, uit));
      invoer.focus();
      return;
    }
    // ----- kiezen: van het Nederlandse woord naar het plaatje (of de betekenis, als er geen plaatje is) -----
    const metBeeld = !!r[4], waarde = (n) => (metBeeld ? WL[n][4] : WL[n][2]);
    const gezien = new Set([waarde(nr)]), fout = [];
    const kandidaten = App.schud(WL.map((_, n) => n).filter((n) => WL[n][0] === r[0]));
    for (const n of kandidaten) { if (fout.length === 2) break; if (!waarde(n) || gezien.has(waarde(n))) continue; gezien.add(waarde(n)); fout.push(n); }
    const opties = App.schud([nr, ...fout]);
    const knoppen = opties.map((n) => el('button', { type: 'button', class: 'optie' + (metBeeld ? ' beeld' : ''), onclick: () => {
      knoppen.forEach((b, i) => { b.disabled = true; if (opties[i] === nr) b.classList.add('goed'); });
      if (n !== nr) knoppen[opties.indexOf(n)].classList.add('fout');
      nakijken(k, r, n === nr, klaar, uit, true);
    } }, metBeeld ? WL[n][4] : el('span', { hulp: WL[n][2] })));
    pagina.append(el('div', { class: 'kaart midden' },
      el('p', { class: 'zacht', en: metBeeld ? 'Which picture fits this word?' : 'What does this word mean?' }, metBeeld ? 'Welk plaatje past bij dit woord?' : 'Wat betekent dit woord?'),
      el('div', { class: 'groot' }, k.nl, ' ', el('button', { class: 'rond', title: 'luister', 'aria-label': 'luister', onclick: () => Spraak.zeg(k.nl) }, '🔊')),
      zinRegel(r), // het woord in een zin: zo ziet u hoe het gebruikt wordt
      el('div', { class: 'opties' + (metBeeld ? ' beelden' : ''), style: 'max-width:520px;margin:16px auto 0;text-align:left' }, knoppen),
      uit));
  }

  // kaart zonder regel in de woordenlijst: omdraaien en zelf zeggen of u het wist (de pagina kan dit niet nakijken)
  function losseKaart(k, klaar) {
    const achter = el('div', { hidden: true }, k.beeld ? el('div', { class: 'beeld', style: 'font-size:3rem' }, k.beeld) : null, el('p', { class: 'zacht', style: 'font-style:italic', hulp: k.en || '' }));
    const knoppen = el('div', { class: 'knoppen', style: 'justify-content:center' },
      el('button', { class: 'knop', en: 'show', onclick: () => { achter.hidden = false; knoppen.textContent = ''; knoppen.append(
        el('button', { class: 'knop licht', en: 'I did not know it', onclick: () => klaar(false) }, '✘ Wist ik niet'),
        el('button', { class: 'knop', en: 'I knew it', onclick: () => klaar(true) }, '✔ Wist ik')); } }, 'Toon'));
    pagina.append(el('div', { class: 'kaart midden' },
      el('p', { class: 'zacht', en: 'What does this word mean?' }, 'Wat betekent dit woord?'),
      el('div', { class: 'groot' }, k.nl, ' ', el('button', { class: 'rond', title: 'luister', onclick: () => Spraak.zeg(k.nl) }, '🔊')),
      achter, knoppen));
  }

  function zinKaart(k, klaar) {
    const [voor, woord, na] = k.zin.split(/[{}]/);
    const invoer = el('input', { class: 'gat', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    const uit = el('div');
    const controleer = () => {
      const ok = App.kaal(invoer.value.trim()) === App.kaal(woord);
      invoer.disabled = true;
      uit.textContent = '';
      uit.append(
        el('p', { class: 'uitslag ' + (ok ? 'goed' : 'fout') }, ok ? '✔ Goed!' : '✘ Het goede woord: ' + woord),
        el('p', {}, voor, el('span', { class: 'gatwoord' }, woord), na, ' ', el('button', { class: 'rond', onclick: () => Spraak.zeg(voor + woord + na) }, '🔊')),
        el('div', { class: 'knoppen', style: 'justify-content:center' }, el('button', { class: 'knop', en: 'next', onclick: () => klaar(ok) }, 'Verder')));
      uit.querySelector('.knop').focus();
      if (ok) App.goed(uit.querySelector('.knop'));
    };
    const knop = el('button', { class: 'knop', en: 'check', onclick: () => { knop.remove(); hint.remove(); controleer(); } }, 'Controleer');
    const hint = el('button', { class: 'knop licht', en: 'first letter', onclick: () => { invoer.value = woord[0]; invoer.focus(); } }, 'Eerste letter');
    invoer.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !invoer.disabled) { knop.remove(); hint.remove(); controleer(); } });
    pagina.append(el('div', { class: 'kaart midden' },
      el('p', { class: 'zacht', en: 'Type the missing word.' }, 'Typ het woord in het gat.'),
      el('p', { style: 'font-size:1.2rem' }, voor, invoer, na),
      el('p', { class: 'zacht klein' }, `uit les ${k.les || ''}`),
      el('div', { class: 'knoppen', style: 'justify-content:center' }, knop, hint), uit));
    invoer.focus();
  }

  begin();
})();
</script>
</body>
</html>
