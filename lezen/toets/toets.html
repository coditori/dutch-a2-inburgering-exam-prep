<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lezen: toets</title>
<link rel="stylesheet" href="../../shared/app.css">
<script src="../../shared/thema.js"></script>
</head>
<body>
<div id="pagina"><main><p class="zacht">Even wachten…</p></main></div>
<script src="../../shared/woorden.js"></script>
<script src="../../shared/srs.js"></script>
<script src="../../shared/audio.js"></script>
<script src="../../shared/app.js"></script>
<script src="../lezen.js"></script>
<script>
// Toets in examen-indeling: tekst links, één vraag rechts, 65 minuten, uitslag pas aan het einde.
// toets.html?t=A laadt A.json. Antwoorden en de klok blijven bewaard als de pagina opnieuw laadt.
(async () => {
  const { el } = App;
  const MINUTEN = 65;
  const id = new URLSearchParams(location.search).get('t') || 'A';
  const pagina = document.getElementById('pagina');
  let toets;
  try { toets = await Lezen.json(`${id}.json`); } catch (e) { pagina.textContent = 'Deze toets bestaat niet: ' + id; return; }
  const kop = App.kop(`Lezen: ${toets.titel}`, '../index.html');
  const klok = el('b', { class: 'klok' });
  kop.insertBefore(klok, kop.lastChild);
  const vragen = toets.teksten.flatMap((t, ti) => t.vragen.map((v) => ({ ti, v })));

  let stand = App.lees('lezen-toets-bezig', null);
  if (!stand || stand.id !== id) stand = null;
  const bewaar = () => App.schrijf('lezen-toets-bezig', stand);
  let tik = null;

  function welkom() {
    document.body.classList.remove('geen-woorden');
    const eerder = Lezen.P.toets[id] || [];
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0' }, `Welkom bij ${toets.titel}`),
      el('p', {}, `U moet in deze toets ${vragen.length} vragen beantwoorden. U hebt ${MINUTEN} minuten.`),
      el('p', { class: 'zacht', en: 'Like the real exam: read the question first, then the text. No word help during the test. You see the result at the end.' },
        'Net als het echte examen: lees eerst de vraag, dan de tekst. Er is geen hulp bij woorden. De uitslag ziet u aan het einde.'),
      eerder.length ? el('p', { class: 'zacht klein' }, 'Eerder: ' + eerder.map((r) => `${App.cijfer(r.score, r.totaal)} (${r.datum})`).join('; ')) : null,
      el('div', { class: 'knoppen' }, el('button', { class: 'knop', onclick: () => {
        stand = { id, start: Date.now(), nu: 0, antwoorden: {}, volgorde: vragen.map((q) => App.schud(q.v.o.map((_, i) => i))) };
        bewaar(); examen();
      } }, 'Start')))));
    klok.textContent = '';
  }

  const rest = () => Math.max(0, MINUTEN * 60 - Math.floor((Date.now() - stand.start) / 1000));
  function tekenKlok() {
    const s = rest();
    klok.textContent = `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (s <= 0) inleveren();
  }

  function examen() {
    document.body.classList.add('geen-woorden');
    clearInterval(tik);
    tik = setInterval(tekenKlok, 1000);
    tekenKlok();
    if (stand && !stand.klaar) tekenVraag();
  }

  function tekenVraag() {
    const q = vragen[stand.nu];
    const links = el('section'), rechts = el('section');
    const vraagDoel = el('div');
    pagina.textContent = '';
    pagina.append(el('div', { class: 'examen twee' }, links, rechts),
      el('div', { class: 'voet' },
        el('button', { class: 'knop', disabled: stand.nu === 0, onclick: () => ga(stand.nu - 1) }, '‹ Vorige'),
        el('span', {}, el('b', {}, `${stand.nu + 1} / ${vragen.length}`), ' ',
          el('button', { class: 'knop klein', en: 'overview', onclick: overzicht }, '▦ Overzicht')),
        stand.nu < vragen.length - 1
          ? el('button', { class: 'knop', onclick: () => ga(stand.nu + 1) }, 'Volgende ›')
          : el('button', { class: 'knop', en: 'hand in', onclick: overzicht }, 'Inleveren')));
    Lezen.tekst(links, toets.teksten[q.ti], { leesEerst: true });
    rechts.append(vraagDoel);
    const blok = Lezen.vraag(vraagDoel, q.v, {
      volgorde: stand.volgorde[stand.nu],
      gekozen: stand.antwoorden[stand.nu],
      op: (keuze) => { stand.antwoorden[stand.nu] = keuze; bewaar(); blok.teken(keuze, false); },
    });
    window.scrollTo(0, 0);
  }
  function ga(n) { stand.nu = n; bewaar(); tekenVraag(); }

  function overzicht() {
    const open = vragen.filter((_, i) => stand.antwoorden[i] == null).length;
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0', en: 'overview' }, 'Overzicht'),
      el('p', {}, open ? `U hebt ${open} ${open === 1 ? 'vraag' : 'vragen'} nog niet beantwoord.` : 'U hebt alle vragen beantwoord.'),
      el('div', { class: 'raster' }, vragen.map((_, i) => el('button', { class: stand.antwoorden[i] != null ? 'af' : '', onclick: () => ga(i) }, String(i + 1)))),
      el('div', { class: 'knoppen' },
        el('button', { class: 'knop licht', onclick: tekenVraag }, 'Terug naar de vraag'),
        el('button', { class: 'knop', en: 'hand in: you cannot change answers after this', onclick: inleveren }, 'Inleveren')))));
  }

  function inleveren() {
    if (stand.klaar) return;
    clearInterval(tik);
    stand.klaar = true;
    stand.sec = Math.min(MINUTEN * 60, Math.floor((Date.now() - stand.start) / 1000));
    stand.score = vragen.filter((_, i) => stand.antwoorden[i] === 0).length;
    (Lezen.P.toets[id] = Lezen.P.toets[id] || []).push({ score: stand.score, totaal: vragen.length, datum: new Date().toISOString().slice(0, 10), sec: stand.sec });
    Lezen.bewaar();
    bewaar();
    uitslag();
  }

  function uitslag(kijk) {
    document.body.classList.remove('geen-woorden');
    clearInterval(tik);
    klok.textContent = '';
    const n = vragen.length;
    const goedGenoeg = stand.score >= 20;
    const links = el('section'), rechts = el('section');
    const raster = el('div', { class: 'raster' }, vragen.map((_, i) => el('button', {
      class: (stand.antwoorden[i] === 0 ? 'goed' : 'fout') + (kijk === i ? ' nu' : ''), onclick: () => uitslag(i) }, String(i + 1))));
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      ...App.cijferBlok(stand.score, n),
      el('p', { class: 'midden uitslag ' + (goedGenoeg ? 'goed' : 'fout'), en: goedGenoeg ? '20 or more: exam level.' : 'Goal: 20 of 25. Look at the red questions.' },
        goedGenoeg ? '✔ 20 of meer: examenniveau.' : 'Doel: 20 van de 25. Bekijk de rode vragen.'),
      el('p', { class: 'midden zacht klein' }, `Tijd: ${Math.floor(stand.sec / 60)} minuten. Klik op een nummer: u ziet de vraag en de zin met het antwoord.`),
      raster,
      el('div', { class: 'knoppen' },
        el('button', { class: 'knop licht', en: 'again', onclick: () => { stand = null; App.schrijf('lezen-toets-bezig', null); welkom(); } }, 'Nog een keer'),
        el('a', { class: 'knop', href: '../index.html' }, 'Naar de lessen')))));
    if (kijk != null) {
      const q = vragen[kijk];
      pagina.append(el('div', { class: 'examen', style: 'padding-bottom:20px' }, links, rechts));
      Lezen.tekst(links, toets.teksten[q.ti], {});
      Lezen.vraag(rechts, q.v, { volgorde: stand.volgorde[kijk], gekozen: stand.antwoorden[kijk], toonGoed: true });
      rechts.prepend(el('p', { class: 'zacht klein' }, `Vraag ${kijk + 1}` + (stand.antwoorden[kijk] == null ? ', niet beantwoord' : '')));
      Lezen.markeer(links, q.v.b);
    }
  }

  if (!stand) welkom(); else if (stand.klaar) uitslag(); else examen();
})();
</script>
</body>
</html>
