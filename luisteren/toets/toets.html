<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luisteren: toets</title>
<link rel="stylesheet" href="../../shared/app.css">
<script src="../../shared/thema.js"></script>
<link rel="stylesheet" href="../luisteren.css">
</head>
<body>
<div id="pagina"><main><p class="zacht">Even wachten...</p></main></div>
<script src="../../shared/woorden.js"></script>
<script src="../../shared/srs.js"></script>
<script src="../../shared/audio.js"></script>
<script src="../../shared/app.js"></script>
<script src="../../lezen/lezen.js"></script>
<script src="../luisteren.js"></script>
<script>
// Toets in examen-indeling: links de situatie en het geluid, rechts één vraag. 45 minuten, uitslag aan het einde.
// toets.html?t=A laadt A.json: { items: [{ context, soort: 'gesprek' | 'voicemail' | ..., regels: [{s, t}], vragen: [{ sit, v, o }] }] }
(async () => {
  const { el } = App;
  const MINUTEN = 45;
  const id = new URLSearchParams(location.search).get('t') || 'A';
  const pagina = document.getElementById('pagina');
  let toets;
  try { toets = await Lezen.json(`${id}.json`); } catch (e) { pagina.textContent = 'Deze toets bestaat niet: ' + id; return; }
  const kop = App.kop(`Luisteren: ${toets.titel}`, '../index.html');
  App.volumeKnop(kop); // het volume rechtsboven, zoals bij DUO
  // de klok staat achter een knop, zoals bij DUO: klik op de klok om de tijd te zien
  let klok = null;
  const stopKlok = () => { if (klok) klok.stop(); klok = null; };
  const vragen = toets.items.flatMap((it, ii) => it.vragen.map((v) => ({ ii, v })));
  let stand = App.lees('luisteren-toets-bezig', null);
  if (!stand || stand.id !== id) stand = null;
  const bewaar = () => App.schrijf('luisteren-toets-bezig', stand);

  function welkom() {
    Luister.stop();
    const eerder = Luister.P.toets[id] || [];
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0' }, `Welkom bij ${toets.titel}`),
      el('p', {}, `U moet in deze toets ${vragen.length} vragen beantwoorden. U hebt ${MINUTEN} minuten.`),
      el('p', { class: 'zacht', en: 'Like the DUO practice exam: when a question opens, everything plays by itself: the intro, the fragment, the question and the answers. You may listen again as often as you want, and go 10 seconds back or forward. No text, no slow button. You see the result at the end.' },
        'Net als bij DUO: bij elke vraag speelt alles vanzelf: de inleiding, het fragment, de vraag en de antwoorden. U mag zo vaak luisteren als u wilt, en 10 seconden terug of verder. Er is geen tekst en geen langzame knop. De uitslag ziet u aan het einde.'),
      eerder.length ? el('p', { class: 'zacht klein' }, 'Eerder: ' + eerder.map((r) => `${App.cijferVan('luisteren', r.score, r.totaal)} (${r.datum})`).join('; ')) : null,
      el('div', { class: 'knoppen' }, el('button', { class: 'knop', onclick: () => {
        stand = { id, start: Date.now(), nu: 0, antwoorden: {}, vlag: {}, volgorde: vragen.map((q) => App.volgorde(q.v.o)) };
        bewaar(); examen();
      } }, 'Start')))));
    stopKlok();
  }
  function examen() {
    document.body.classList.add('geen-woorden');
    stand.vlag = stand.vlag || {};
    stopKlok();
    klok = App.examenKlok({ kop, minuten: MINUTEN, start: stand.start, verborgen: true, op0: inleveren });
    if (stand && !stand.klaar) tekenVraag();
  }

  function tekenVraag() {
    Luister.stop();
    const q = vragen[stand.nu], it = toets.items[q.ii];
    const links = el('section'), rechts = el('section'), vraagDoel = el('div');
    pagina.textContent = '';
    pagina.append(el('div', { class: 'examen twee kort' }, links, rechts),
      el('div', { class: 'voet' },
        el('button', { class: 'knop', disabled: stand.nu === 0, onclick: () => ga(stand.nu - 1) }, 'Vorige'),
        el('span', {}, el('b', {}, `${stand.nu + 1} / ${vragen.length}`), ' ', App.overzichtKnop(overzicht), ' ', App.vlagKnop(stand.vlag, stand.nu, bewaar)),
        stand.nu < vragen.length - 1 ? el('button', { class: 'knop', onclick: () => ga(stand.nu + 1) }, 'Volgende') : el('button', { class: 'knop', en: 'hand in', onclick: overzicht }, 'Inleveren')));
    const intro = el('p', { class: 'intro' }, it.context);
    const opdracht = el('p', { class: 'lees-eerst' }, 'Lees eerst de vraag.', el('br'), 'Luister daarna naar de tekst.');
    const beeld = el('div', { class: 'fragment-beeld' }, App.foto(it.foto, it.soort === 'voicemail' ? '📞' : it.soort === 'radio' ? '📻' : it.soort === 'nieuws' ? '📺' : '🗣️'));
    rechts.append(vraagDoel);
    const volgorde = stand.volgorde[stand.nu];
    const blok = Lezen.vraag(vraagDoel, q.v, { volgorde, gekozen: stand.antwoorden[stand.nu],
      op: (keuze) => { stand.antwoorden[stand.nu] = keuze; bewaar(); blok.teken(keuze, false); } });
    // zoals bij DUO: alles speelt vanzelf na elkaar; wat nu speelt krijgt een rand
    const doelen = [intro, opdracht, beeld, vraagDoel.querySelector('.vraag'), ...vraagDoel.querySelectorAll('.optie')];
    const speler = Luister.examenSpeler([{ tekst: it.context }, { tekst: Luister.INSTRUCTIE }, { regels: it.regels },
      { tekst: [q.v.sit, q.v.v].filter(Boolean).join(' ') }, ...volgorde.map((nr) => ({ tekst: q.v.o[nr] }))],
    { opDeel: (i) => doelen.forEach((d, j) => d && d.classList.toggle('speelt', i === j)) });
    links.append(intro, opdracht, beeld, speler.vak);
    window.scrollTo(0, 0);
    speler.speel();
  }
  function ga(n) { stand.nu = n; bewaar(); tekenVraag(); }

  function overzicht() {
    Luister.stop();
    const open = vragen.filter((_, i) => stand.antwoorden[i] == null).length;
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0', en: 'overview' }, 'Overzicht'),
      el('p', {}, open ? `U hebt ${open} ${open === 1 ? 'vraag' : 'vragen'} nog niet beantwoord.` : 'U hebt alle vragen beantwoord.'),
      Object.keys(stand.vlag).length ? el('p', { class: 'zacht klein', en: 'a dot = a question you marked' }, 'Een stip: een vraag die u markeerde.') : null,
      // per fragment, zoals het overzicht van DUO
      el('div', { class: 'raster-groepen' }, toets.items.map((it, ii) => el('div', { class: 'raster-groep' }, el('p', { class: 'raster-kop' }, `Fragment ${ii + 1}`),
        el('div', { class: 'raster' }, vragen.map((q, i) => (q.ii !== ii ? null : el('button', { class: (stand.antwoorden[i] != null ? 'af' : '') + (stand.vlag[i] ? ' vlag' : ''), onclick: () => ga(i) }, String(i + 1)))))))),
      el('div', { class: 'knoppen' }, el('button', { class: 'knop licht', onclick: tekenVraag }, 'Terug naar de vraag'),
        el('button', { class: 'knop', en: 'hand in: you cannot change answers after this', onclick: inleveren }, 'Inleveren')))));
  }
  function inleveren() {
    if (stand.klaar) return;
    stopKlok(); Luister.stop();
    stand.klaar = true;
    stand.sec = Math.min(MINUTEN * 60, Math.floor((Date.now() - stand.start) / 1000));
    stand.score = vragen.filter((_, i) => stand.antwoorden[i] === 0).length;
    (Luister.P.toets[id] = Luister.P.toets[id] || []).push({ score: stand.score, totaal: vragen.length, datum: new Date().toISOString().slice(0, 10), sec: stand.sec });
    // de gemarkeerde vragen gaan vanzelf naar Mijn vragen: daar vindt de leerling ze later terug
    stand.gemarkeerd = Object.keys(stand.vlag || {}).map(Number).filter((i) => vragen[i]);
    if (stand.gemarkeerd.length) App.MijnVragen.zetVeel('luisteren', id, stand.gemarkeerd.map((i) => [i, vragen[i].v.v]));
    Luister.bewaar(); bewaar(); uitslag(); App.vier(App.cijferDeel('luisteren', stand.score, vragen.length));
  }
  function uitslag(kijk) {
    document.body.classList.remove('geen-woorden');
    stopKlok(); Luister.stop();
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      ...App.cijferBlok(stand.score, vragen.length, null, { map: 'luisteren', beantwoord: vragen.filter((_, i) => stand.antwoorden[i] != null).length,
        eerder: (Luister.P.toets[id] || []).slice(0, -1).map((r) => App.cijferDeel('luisteren', r.score, r.totaal || vragen.length)) }),
      perSoort(),
      App.bewaarVragenRij('luisteren', id, vragen.map((q, i) => [i, q.v.v]).filter(([i]) => stand.antwoorden[i] !== 0), (stand.gemarkeerd || []).length),
      el('p', { class: 'midden zacht klein' }, `Tijd: ${Math.floor(stand.sec / 60)} minuten. Klik op een nummer: u ziet de vraag, het goede antwoord en de tekst van het gesprek.`),
      el('div', { class: 'raster' }, vragen.map((_, i) => el('button', { class: (stand.antwoorden[i] === 0 ? 'goed' : 'fout') + (kijk === i ? ' nu' : ''), onclick: () => uitslag(i) }, String(i + 1)))),
      el('div', { class: 'knoppen' }, el('button', { class: 'knop licht', en: 'again', onclick: () => { stand = null; App.schrijf('luisteren-toets-bezig', null); welkom(); } }, 'Nog een keer'),
        el('a', { class: 'knop', href: '../index.html' }, 'Naar de lessen')))));
    if (kijk != null) {
      const q = vragen[kijk], it = toets.items[q.ii];
      const links = el('section'), rechts = el('section');
      const tr = Luister.transcript(it.regels);
      pagina.append(el('div', { class: 'examen', style: 'padding-bottom:20px' }, links, rechts));
      links.append(el('p', { class: 'intro' }, it.context), Luister.speler(it.regels, { opRegel: tr.opRegel, opTijd: tr.opTijd }), tr.vak);
      Lezen.vraag(rechts, q.v, { volgorde: stand.volgorde[kijk], gekozen: stand.antwoorden[kijk], toonGoed: true });
      rechts.prepend(el('div', { class: 'kijk-kop' }, el('p', { class: 'zacht klein' }, `Vraag ${kijk + 1}` + (stand.antwoorden[kijk] == null ? ', niet beantwoord' : '')), App.bewaarVraagKnop('luisteren', id, kijk, q.v.v)));
    }
  }
  // per soort vraag: hoeveel goed; de zwakste soort krijgt een knop naar een trainer
  function perSoort() {
    const rijen = {};
    vragen.forEach((q, i) => {
      const s = App.vraagSoort(q.v.v);
      const r = rijen[s.id] = rijen[s.id] || { naam: s.naam, en: s.en, goed: 0, totaal: 0, href: `../trainers/${s.id === 'tijd' || s.id === 'getal' ? 'getallen' : 'nietwel'}.html`, hrefNaam: 'Oefen dit met een trainer' };
      r.totaal++; if (stand.antwoorden[i] === 0) r.goed++;
    });
    return App.perSoort(Object.values(rijen));
  }
  if (!stand) welkom(); else if (stand.klaar) uitslag(); else examen();
})();
</script>
</body>
</html>
