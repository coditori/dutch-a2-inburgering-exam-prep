<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nederlands A2 – inburgering</title>
<link rel="stylesheet" href="shared/app.css">
<script src="shared/thema.js"></script>
</head>
<body>
<main>
  <div class="kaart" id="vandaag"></div>
  <h2 data-en="take a practice exam now: you do not need to do the lessons first">Meteen een examen doen</h2>
  <p class="zacht klein" data-en="Choose an exam. It is like the real exam: with a clock, and your mark (up to 10) at the end.">Kies een examen. Het is net als het echte examen: met een klok, en aan het einde uw cijfer (tot 10).</p>
  <div class="kaart" id="oefenexamens"></div>
  <h2 data-en="the five exams: lessons from zero to exam level">De vijf examens · lessen</h2>
  <div class="tegels" id="examens"></div>
  <h2 data-en="the ladder: the same 5 steps in every exam">De ladder</h2>
  <table class="ladder" id="ladder"></table>
  <p class="klein" style="margin-top:28px"><a href="instellingen.html#voortgang" data-en="see your progress or start again">Uw voortgang bekijken of opnieuw beginnen</a></p>
</main>
<script src="shared/woorden.js"></script>
<script src="shared/srs.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/app.js"></script>
<script>
(async () => {
  const { el } = App;
  App.kop('Nederlands A2 · inburgering');
  const TREDES = [
    ['groeten, de klok', 'greetings, the clock'],
    ['bouwstenen: ik / u, niet / geen, vraagwoorden', 'building blocks'],
    ['dagelijks leven: familie, huis, eten, winkel, vervoer', 'daily life'],
    ["examenthema's: werk, gezondheid, school, gemeente", 'exam themes'],
    ['examentaal: de woorden uit de vragen', 'exam language'],
  ];
  // een examen is klaar als de map een index.html heeft
  const EXAMENS = await Promise.all(['Lezen', 'Luisteren', 'Schrijven', 'Spreken', 'KNM'].map(async (naam) => {
    const map = naam.toLowerCase();
    const klaar = await fetch(`${map}/index.html`, { method: 'HEAD' }).then((r) => r.ok).catch(() => false);
    let n = 0;
    // lessen staan in lessons/ ; bij KNM in themes/ (elk thema = 4 stappen: woorden, weetjes, situaties, meer weetjes)
    for (const [pad, keer] of [['lessons', 1], ['themes', 4]]) {
      try { n = n || keer * (await (await fetch(`${map}/${pad}/index.json`, { cache: 'no-cache' })).json()).length; } catch (e) { /* deze map is er niet */ }
    }
    const gedaan = Object.values((App.lees(map, {}).lessen) || {}).filter((r) => r && r.beste / r.totaal >= 0.8).length;
    return { naam, map, href: `${map}/index.html`, klaar, n, gedaan, beeld: { Lezen: '📖', Luisteren: '🎧', Schrijven: '✍️', Spreken: '💬', KNM: '🏛️' }[naam] };
  }));
  const stand = App.tredeStand();
  document.getElementById('ladder').append(...TREDES.map(([nl, en], t) => el('tr', {},
    el('th', {}, `Trede ${t}`),
    el('td', { en }, nl),
    el('td', { style: 'width:28%' }, el('div', { class: 'balk' }, el('i', { style: `width:${stand[t].totaal ? Math.round(100 * stand[t].bekend / stand[t].totaal) : 0}%` })),
      el('span', { class: 'klein zacht' }, `${stand[t].bekend} van ${stand[t].totaal} woorden`)))));

  const lezen = App.lees('lezen', { lessen: {} });
  let lessen = [];
  try { lessen = await (await fetch('lezen/lessons/index.json', { cache: 'no-cache' })).json(); } catch (e) { /* nog geen lessen */ }
  const gehaald = (l) => { const r = (lezen.lessen || {})[l.id]; return r && r.beste / r.totaal >= 0.8; };
  const volgende = lessen.find((l) => !gehaald(l));
  const tel = SRS.tel();
  document.getElementById('vandaag').append(
    el('h3', { en: 'today' }, 'Vandaag'),
    el('div', { class: 'knoppen' },
      el('a', { class: 'knop' + (tel.nu ? '' : ' licht'), href: 'lezen/herhaal.html', en: 'review' }, `Herhalen: ${tel.nu} ${tel.nu === 1 ? 'kaart' : 'kaarten'}`),
      volgende ? el('a', { class: 'knop', href: `lezen/les.html?les=${volgende.id}`, en: 'next reading lesson' }, `Lezen ${volgende.id}: ${volgende.titel}`) : null));

  document.getElementById('examens').append(...EXAMENS.map((x) => x.klaar
    ? el('a', { class: 'tegel examen-tegel', href: x.href }, el('span', { class: 'tegel-icoon' }, x.beeld), el('b', {}, x.naam),
      el('span', { class: 'klein zacht' }, x.n ? `${x.gedaan} van ${x.n} lessen` : ''), el('div', { class: 'balk' }, el('i', { style: `width:${x.n ? Math.round(100 * x.gedaan / x.n) : 0}%` })))
    : el('div', { class: 'tegel examen-tegel slot' }, el('span', { class: 'tegel-icoon' }, x.beeld), el('b', {}, x.naam), el('span', { class: 'klein zacht', en: 'not ready yet' }, 'nog niet klaar'))));

  // meteen een examen doen: per examen de toetsen (A, B, C ...) als knop, met het beste cijfer als u de toets al deed
  const rijen = await Promise.all(EXAMENS.filter((x) => x.klaar).map(async (x) => {
    let toetsen = [];
    try { toetsen = await (await fetch(`${x.map}/toets/index.json`, { cache: 'no-cache' })).json(); } catch (e) { /* geen toetsen */ }
    if (!toetsen.length) return null;
    const gedaan = (App.lees(x.map, {}).toets) || {};
    return el('div', { class: 'examenrij' }, el('span', { class: 'examennaam' }, el('span', { 'aria-hidden': 'true' }, x.beeld), ' ', el('b', {}, x.naam)),
      el('div', { class: 'toetsknoppen' }, toetsen.map((t) => {
        const r = gedaan[t.id] || [];
        const beste = r.length ? Math.max(...r.map((y) => y.score / (y.totaal || t.vragen || 1))) : null;
        return el('a', { class: 'toetsknop' + (r.length ? ' gedaan' : ''), href: `${x.map}/toets/toets.html?t=${t.id}`, title: t.titel, 'aria-label': `${x.naam} ${t.titel}` },
          el('b', {}, t.id), beste == null ? null : el('span', {}, App.cijfer(beste, 1)));
      })));
  }));
  document.getElementById('oefenexamens').append(...rijen.filter(Boolean));
})();
</script>
</body>
</html>
