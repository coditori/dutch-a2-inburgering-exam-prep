<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taal Klim – oefenen voor het inburgeringsexamen A2</title>
<link rel="stylesheet" href="shared/app.css">
<script src="shared/thema.js"></script>
</head>
<body>
<main>
  <section class="kaart groot-held" id="vandaag"></section>
  <div id="accounttip"></div>
  <div class="cijfers" id="cijfers"></div>
  <h2 id="kies" data-en="the five exams">De vijf examens</h2>
  <p class="zacht klein" data-en="Click the name for the lessons, from zero to exam level. Or click A, B, C or D for a practice exam: like the real exam, with a clock and your mark (up to 10) at the end. You do not need to do the lessons first.">Klik op de naam voor de lessen: van nul tot het examen. Of klik op A, B, C of D voor een oefenexamen: net als het echte examen, met een klok en aan het einde uw cijfer (tot 10). U hoeft niet eerst de lessen te doen.</p>
  <div class="examens" id="examens"></div>
  <h2 data-en="your words: the ladder has the same 5 steps in every exam">Uw woorden · de ladder</h2>
  <table class="ladder" id="ladder"></table>
  <p class="klein" style="margin-top:28px"><a href="instellingen.html#voortgang" data-en="see your progress or start again">Uw voortgang bekijken of opnieuw beginnen</a></p>
</main>
<script src="shared/woorden.js"></script>
<script src="shared/srs.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/app.js"></script>
<script>
(async () => {
  const { el, teken } = App;
  App.kop('Taal Klim');
  const TREDES = [
    ['groeten, de klok', 'greetings, the clock'],
    ['bouwstenen: ik / u, niet / geen, vraagwoorden', 'building blocks'],
    ['dagelijks leven: familie, huis, eten, winkel, vervoer', 'daily life'],
    ["examenthema's: werk, gezondheid, school, gemeente", 'exam themes'],
    ['examentaal: de woorden uit de vragen', 'exam language'],
  ];
  // per examen: wat u doet, en hoe lang het echte examen duurt (minuten)
  const INFO = {
    lezen: ['teksten, brieven en e-mails', 'texts, letters and e-mails', 65, 'vragen', 'questions'],
    luisteren: ['gesprekken en berichten', 'conversations and messages', 45, 'vragen', 'questions'],
    schrijven: ['een e-mail, een briefje, een formulier', 'an e-mail, a note, a form', 40, 'opdrachten', 'tasks'],
    spreken: ['antwoord geven op een vraag', 'answer a question', 35, 'vragen', 'questions'],
    knm: ['leven en werken in Nederland', 'living and working in the Netherlands', 45, 'vragen', 'questions'],
  };
  const EXAMENS = await App.overzicht();

  // ---------- het grote vak: wat doet u nu? ----------
  const totaal = EXAMENS.reduce((s, x) => s + x.n, 0), gedaan = EXAMENS.reduce((s, x) => s + x.gedaan, 0);
  const nToetsen = EXAMENS.reduce((s, x) => s + x.toetsen.length, 0);
  const nToetsGedaan = EXAMENS.reduce((s, x) => s + x.toetsen.filter((t) => t.beste != null).length, 0);
  const stand = App.tredeStand();
  const woordenTotaal = stand.reduce((s, t) => s + t.totaal, 0), woordenBekend = stand.reduce((s, t) => s + t.bekend, 0);
  const tel = SRS.tel();
  const nieuw = !gedaan && !nToetsGedaan && !tel.totaal; // eerste bezoek: nog niets gedaan

  const lezen = EXAMENS[0];
  const pLezen = (App.lees('lezen', {}).lessen) || {};
  const volgende = lezen.lessen.find((l) => { const r = pLezen[l.id]; return !(r && r.beste / r.totaal >= 0.8); });
  const ander = EXAMENS.find((x) => x.klaar && x.gedaan < x.n); // Lezen klaar? Dan verder met het volgende examen.
  const verder = volgende
    ? el('a', { class: 'knop', href: `lezen/les.html?les=${volgende.id}`, en: nieuw ? 'start with the first reading lesson' : 'next reading lesson' }, nieuw ? 'Begin met les 1' : `Lezen ${volgende.id}: ${volgende.titel}`)
    : ander ? el('a', { class: 'knop', href: ander.href, en: 'continue' }, `Verder met ${ander.naam}`) : null;
  const procent = totaal ? Math.round(100 * gedaan / totaal) : 0;
  document.getElementById('vandaag').append(el('div', { class: 'held-rij' },
    el('div', {},
      el('span', { class: 'oogje' }, 'Inburgering · A2'),
      nieuw
        ? [el('h2', { en: 'practice for the civic integration exam' }, 'Oefen voor het inburgeringsexamen'),
          el('p', { en: 'Free and without an account. Lessons from zero, and practice exams with a clock.' }, 'Gratis en zonder account. Lessen vanaf nul, en oefenexamens met een klok.')]
        : [el('h2', { en: 'continue' }, 'Ga verder'),
          el('p', {}, tel.nu
            ? el('span', { en: 'cards to review today' }, `Vandaag: ${tel.nu} ${tel.nu === 1 ? 'kaart' : 'kaarten'} om te herhalen.`)
            : el('span', { en: 'no cards to review today' }, 'Vandaag zijn er geen kaarten om te herhalen.'))],
      el('div', { class: 'knoppen' },
        verder,
        nieuw ? el('a', { class: 'knop licht', href: '#kies', en: 'take a practice exam' }, 'Doe een oefenexamen') : null,
        tel.nu ? el('a', { class: 'knop licht', href: 'lezen/herhaal.html', en: 'review' }, `Herhalen: ${tel.nu} ${tel.nu === 1 ? 'kaart' : 'kaarten'}`) : null,
        nieuw ? null : el('a', { class: 'knop licht', href: 'profiel.html', en: 'show your friends how far you are' }, teken('deel'), 'Deel uw voortgang'))),
    nieuw ? null : el('div', { class: 'ring', style: `--p:${procent}`, role: 'img', 'aria-label': `${procent} procent van de lessen gehaald` },
      el('b', {}, `${procent}%`), el('span', { en: 'lessons' }, 'lessen'))));

  const getal = (n, van, tekst, en) => el('div', {}, el('b', {}, String(n), el('small', {}, ` / ${van}`)), el('span', { en }, tekst));
  document.getElementById('cijfers').append(
    getal(gedaan, totaal, 'lessen gehaald', 'lessons passed'),
    getal(woordenBekend, woordenTotaal, 'woorden gekend', 'words known'),
    getal(nToetsGedaan, nToetsen, 'oefenexamens gedaan', 'practice exams done'));

  // ---------- inloggen met Google (als de site dat heeft, shared/account.js): het vak staat er zolang u niet bent ingelogd ----------
  // "Niet nu" haalt het een week weg. De stip op de knop Profiel blijft.
  const tip = document.getElementById('accounttip');
  let wasIn = null;
  document.addEventListener('account', () => {
    const s = window.Account.staat, weg = App.lees('account-tip-weg', 0) > SRS.vandaag();
    if (wasIn === false && s.gebruiker) App.toast('✔ U bent ingelogd', 'you are logged in');
    if (s.beschikbaar) wasIn = !!s.gebruiker;
    tip.textContent = '';
    if (!s.beschikbaar || s.gebruiker || weg) return;
    tip.append(el('div', { class: 'kaart acc' },
      el('span', { class: 'ex-icoon', 'aria-hidden': 'true' }, teken('mens')),
      el('div', {},
        el('h3', { en: 'log in and keep your progress' }, 'Log in en bewaar uw voortgang'),
        el('p', { class: 'zacht klein', en: 'With Google. Then you lose nothing, everything is also on your other phone, and you have your own profile for your friends.' },
          'Met Google. Dan raakt u niets kwijt, staat alles ook op uw andere telefoon, en hebt u een eigen profiel voor uw vrienden.'),
        s.fout ? el('p', { class: 'uitslag fout klein', en: 'Logging in did not work. Try again.' }, s.fout === 'venster' ? 'De browser hield het venster van Google tegen. Sta pop-ups toe en probeer het opnieuw.' : 'Inloggen is niet gelukt. Probeer het opnieuw.') : null),
      el('div', { class: 'knoppen', style: 'margin:0' },
        el('button', { type: 'button', class: 'knop', disabled: s.status === 'bezig', en: 'log in with Google', onclick: () => window.Account.login() }, 'Log in met Google'),
        el('button', { type: 'button', class: 'knop tekst klein', en: 'not now', onclick: () => { App.schrijf('account-tip-weg', SRS.vandaag() + 7); tip.textContent = ''; } }, 'Niet nu'))));
  });
  // kwam er voortgang van het account (u logde in op een nieuw apparaat)? Dan de pagina opnieuw, met de nieuwe getallen.
  document.addEventListener('account-gegevens', () => location.reload());

  // ---------- de vijf examens: de lessen (klik op de naam) en de oefenexamens A, B, C ... ----------
  document.getElementById('examens').append(...EXAMENS.map((x) => {
    const [wat, watEn, minuten, soort, soortEn] = INFO[x.map];
    if (!x.klaar) return el('div', { class: `ex slot k-${x.map}` }, el('div', { class: 'ex-kop' },
      el('span', { class: 'ex-icoon' }, teken(x.map)), el('span', { class: 'ex-naam' }, el('b', {}, x.naam), el('span', { class: 'klein zacht', en: 'not ready yet' }, 'nog niet klaar'))));
    const p = x.n ? Math.round(100 * x.gedaan / x.n) : 0;
    const vragen = x.toetsen.length ? x.toetsen[0].vragen : 0;
    return el('article', { class: `ex k-${x.map}` },
      el('a', { class: 'ex-kop', href: x.href, 'aria-label': `${x.naam}: de lessen` },
        el('span', { class: 'ex-icoon' }, teken(x.map)),
        el('span', { class: 'ex-naam' }, el('b', {}, x.naam), el('span', { class: 'klein zacht', en: watEn }, wat)),
        teken('pijl')),
      el('div', {},
        el('div', { class: 'ex-stand' }, el('div', { class: 'balk' }, el('i', { style: `width:${p}%` })), el('span', {}, `${p}%`)),
        el('span', { class: 'klein zacht', en: 'lessons passed' }, `${x.gedaan} van ${x.n} lessen gehaald`)),
      x.toetsen.length ? el('div', { class: 'ex-toets' },
        el('span', { class: 'klein zacht', en: `practice exam: ${vragen} ${soortEn}, ${minuten} minutes` }, `Oefenexamen · ${vragen} ${soort} · ${minuten} min`),
        el('div', { class: 'toetsknoppen' }, x.toetsen.map((t) => {
          // het beste cijfer als u de toets al deed
          const beste = t.beste;
          return el('a', { class: 'toetsknop' + (beste != null ? ' gedaan' : ''), href: `${x.map}/toets/toets.html?t=${t.id}`, title: t.titel, 'aria-label': `${x.naam} ${t.titel}` },
            el('b', {}, t.id), beste == null ? null : el('span', {}, App.cijfer(beste, 1)));
        }))) : null);
  }));

  // ---------- de ladder: hoeveel woorden kent u per trede? ----------
  document.getElementById('ladder').append(...TREDES.map(([nl, en], t) => el('tr', {},
    el('th', { class: stand[t].totaal && stand[t].bekend >= stand[t].totaal ? 'klaar' : '', 'aria-label': `Trede ${t}` }, el('span', { class: 'trede-nr' }, String(t))),
    el('td', { en }, nl),
    el('td', { style: 'width:30%' }, el('div', { class: 'balk' }, el('i', { style: `width:${stand[t].totaal ? Math.round(100 * stand[t].bekend / stand[t].totaal) : 0}%` })),
      el('span', { class: 'klein zacht' }, `${stand[t].bekend} van ${stand[t].totaal} woorden`)))));
})();
</script>
</body>
</html>
