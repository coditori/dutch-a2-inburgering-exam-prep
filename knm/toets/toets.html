<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNM: toets</title>
<link rel="stylesheet" href="../../shared/app.css">
<script src="../../shared/thema.js"></script>
<link rel="stylesheet" href="../knm.css">
</head>
<body>
<div id="pagina"><main><p class="zacht">Even wachten...</p></main></div>
<script src="../../shared/woorden.js"></script>
<script src="../../shared/srs.js"></script>
<script src="../../shared/audio.js"></script>
<script src="../../shared/app.js"></script>
<script src="../../lezen/lezen.js"></script>
<script src="../knm.js"></script>
<script>
// KNM-toets zoals het echte examen: 40 vragen per thema, 45 minuten, drie antwoorden, uitslag aan het einde.
// toets.html?t=A laadt A.json. Antwoorden en klok blijven bewaard als de pagina opnieuw laadt.
(async () => {
  const { el } = App;
  const MINUTEN = 45;
  const THEMA = { gezondheid: 'gezondheid en gezondheidszorg', wonen: 'wonen', werk: 'werk en inkomen', onderwijs: 'onderwijs en opvoeding', instanties: 'instanties', omgang: 'omgangsvormen, waarden en normen', staat: 'staatsinrichting en rechtsstaat', geschiedenis: 'geschiedenis en geografie' };
  const id = new URLSearchParams(location.search).get('t') || 'A';
  const pagina = document.getElementById('pagina');
  let toets;
  try { toets = await Lezen.json(`${id}.json`); } catch (e) { pagina.textContent = 'Deze toets bestaat niet: ' + id; return; }
  const kop = App.kop(`KNM: ${toets.titel}`, '../index.html');
  Spraak.map('../audio/'); // de opnamen van de vragen staan in knm/audio/
  // de klok staat achter een knop, zoals bij DUO: klik op de klok om de tijd te zien
  let klok = null;
  const stopKlok = () => { if (klok) klok.stop(); klok = null; };
  const vragen = toets.vragen;
  // schermen: bij elk nieuw thema eerst een scherm met de naam van het thema
  const schermen = [];
  vragen.forEach((v, i) => { if (i === 0 || vragen[i - 1].thema !== v.thema) schermen.push({ intro: v.thema }); schermen.push({ nr: i }); });

  let stand = App.lees('knm-toets-bezig', null);
  if (!stand || stand.id !== id) stand = null;
  const bewaar = () => App.schrijf('knm-toets-bezig', stand);

  function welkom() {
    document.body.classList.remove('geen-woorden');
    const eerder = KNM.P.toets[id] || [];
    stopKlok();
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0' }, `Welkom bij ${toets.titel}`),
      el('p', {}, `U moet in deze toets ${vragen.length} vragen beantwoorden. U hebt ${MINUTEN} minuten.`),
      el('p', { class: 'zacht', en: 'Like the real exam: questions per theme, three answers, no word help. The button Luister reads the question aloud. Result at the end.' }, 'Net als het echte examen: vragen per thema, drie antwoorden, geen hulp bij woorden. Met de knop Luister hoort u de vraag. De uitslag ziet u aan het einde.'),
      eerder.length ? el('p', { class: 'zacht klein' }, 'Eerder: ' + eerder.map((r) => `${App.cijferVan('knm', r.score, r.totaal)} (${r.datum})`).join('; ')) : null,
      el('div', { class: 'knoppen' }, el('button', { class: 'knop', onclick: () => {
        // de antwoorden staan op alfabet, zoals op het KNM-examen (getallen en datums op volgorde)
        stand = { id, start: Date.now(), nu: 0, antwoorden: {}, vlag: {}, volgorde: vragen.map((v) => App.volgorde(v.o, { alfabet: true })) };
        bewaar(); examen();
      } }, 'Start')))));
  }
  function examen() {
    document.body.classList.add('geen-woorden');
    stand.vlag = stand.vlag || {};
    stopKlok();
    klok = App.examenKlok({ kop, minuten: MINUTEN, start: stand.start, verborgen: true, op0: inleveren });
    if (!stand.klaar) teken();
  }
  const voorlezen = (v) => [v.sit, v.v].filter(Boolean).join(' ');

  function teken() {
    Spraak.stop();
    const s = schermen[stand.nu];
    const vak = el('div', { class: 'toetsvak' });
    pagina.textContent = '';
    pagina.append(vak, el('div', { class: 'voet' },
      el('button', { class: 'knop', disabled: stand.nu === 0, onclick: () => ga(stand.nu - 1) }, 'Vorige'),
      el('span', {}, s.intro ? '' : el('b', {}, `${s.nr + 1} / ${vragen.length} `), el('button', { class: 'knop klein', en: 'overview', onclick: overzicht }, 'Overzicht'), s.intro ? null : [' ', App.vlagKnop(stand.vlag, s.nr, bewaar)]),
      stand.nu < schermen.length - 1 ? el('button', { class: 'knop', onclick: () => ga(stand.nu + 1) }, 'Volgende') : el('button', { class: 'knop', en: 'hand in', onclick: overzicht }, 'Inleveren')));
    if (s.intro) { vak.append(el('div', { class: 'kaart' }, el('p', { style: 'font-size:1.15rem' }, `De volgende vragen gaan over het thema '${THEMA[s.intro] || s.intro}'.`), el('p', { class: 'zacht' }, "Klik op 'Volgende'."))); return; }
    const v = vragen[s.nr];
    const vraagDoel = el('div');
    vak.append(el('div', { class: 'kaart' }, el('div', { class: 'kplaat' }, v.beeld || '🇳🇱'),
      el('p', { class: 'midden' }, el('button', { class: 'knop licht klein', en: 'listen', onclick: () => Spraak.zeg(voorlezen(v)) }, App.teken('luid'), 'Luister')), vraagDoel));
    const blok = Lezen.vraag(vraagDoel, v, { volgorde: stand.volgorde[s.nr], gekozen: stand.antwoorden[s.nr], op: (keuze) => { stand.antwoorden[s.nr] = keuze; bewaar(); blok.teken(keuze, false); } });
    window.scrollTo(0, 0);
  }
  function ga(n) { stand.nu = n; bewaar(); teken(); }
  const schermVan = (nr) => schermen.findIndex((s) => s.nr === nr);

  function overzicht() {
    Spraak.stop();
    const open = vragen.filter((_, i) => stand.antwoorden[i] == null).length;
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      el('h2', { style: 'margin-top:0', en: 'overview' }, 'Overzicht'),
      el('p', {}, open ? `U hebt ${open} ${open === 1 ? 'vraag' : 'vragen'} nog niet beantwoord.` : 'U hebt alle vragen beantwoord.'),
      Object.keys(stand.vlag).length ? el('p', { class: 'zacht klein', en: 'a dot = a question you marked' }, 'Een stip: een vraag die u markeerde.') : null,
      el('div', { class: 'raster' }, vragen.map((_, i) => el('button', { class: (stand.antwoorden[i] != null ? 'af' : '') + (stand.vlag[i] ? ' vlag' : ''), onclick: () => ga(schermVan(i)) }, String(i + 1)))),
      el('div', { class: 'knoppen' }, el('button', { class: 'knop licht', onclick: teken }, 'Terug naar de vraag'),
        el('button', { class: 'knop', en: 'hand in: you cannot change answers after this', onclick: inleveren }, 'Inleveren')))));
  }
  function inleveren() {
    if (stand.klaar) return;
    stopKlok();
    stand.klaar = true;
    stand.sec = Math.min(MINUTEN * 60, Math.floor((Date.now() - stand.start) / 1000));
    stand.score = vragen.filter((_, i) => stand.antwoorden[i] === 0).length;
    (KNM.P.toets[id] = KNM.P.toets[id] || []).push({ score: stand.score, totaal: vragen.length, datum: new Date().toISOString().slice(0, 10), sec: stand.sec });
    KNM.bewaar(); bewaar(); uitslag(); App.vier(App.cijferDeel('knm', stand.score, vragen.length));
  }
  function uitslag(kijk) {
    document.body.classList.remove('geen-woorden');
    stopKlok();
    pagina.textContent = '';
    pagina.append(el('main', {}, el('div', { class: 'kaart' },
      ...App.cijferBlok(stand.score, vragen.length, null, { map: 'knm', beantwoord: vragen.filter((_, i) => stand.antwoorden[i] != null).length,
        eerder: (KNM.P.toets[id] || []).slice(0, -1).map((r) => App.cijferDeel('knm', r.score, r.totaal || vragen.length)) }),
      perThema(),
      el('p', { class: 'midden zacht klein' }, `Tijd: ${Math.floor(stand.sec / 60)} minuten. Klik op een nummer: u ziet de vraag, het goede antwoord en waarom.`),
      el('div', { class: 'raster' }, vragen.map((_, i) => el('button', { class: (stand.antwoorden[i] === 0 ? 'goed' : 'fout') + (kijk === i ? ' nu' : ''), onclick: () => uitslag(i) }, String(i + 1)))),
      el('div', { class: 'knoppen' }, el('button', { class: 'knop licht', en: 'again', onclick: () => { stand = null; App.schrijf('knm-toets-bezig', null); welkom(); } }, 'Nog een keer'), el('a', { class: 'knop', href: '../index.html' }, 'Naar de thema\'s')))));
    if (kijk != null) {
      const v = vragen[kijk]; const doel = el('div');
      pagina.append(el('div', { class: 'toetsvak', style: 'padding-bottom:20px' }, el('div', { class: 'kaart' }, el('p', { class: 'zacht klein' }, `Vraag ${kijk + 1}, ${THEMA[v.thema] || v.thema}` + (stand.antwoorden[kijk] == null ? ', niet beantwoord' : '')), el('div', { class: 'kplaat' }, v.beeld || '🇳🇱'), doel,
        el('div', { class: 'waarom' }, el('b', {}, 'Waarom? '), App.woorden(v.w || '')))));
      Lezen.vraag(doel, v, { volgorde: stand.volgorde[kijk], gekozen: stand.antwoorden[kijk], toonGoed: true });
    }
  }
  // per thema: hoeveel goed. Het zwakste thema krijgt een knop naar de weetjes van dat thema.
  function perThema() {
    const MAP = { gezondheid: '1-gezondheid', wonen: '2-wonen', werk: '3-werk', onderwijs: '4-onderwijs', instanties: '5-instanties', omgang: '6-omgangsvormen', staat: '7-staatsinrichting', geschiedenis: '8-geschiedenis' };
    const rijen = {};
    vragen.forEach((v, i) => {
      const r = rijen[v.thema] = rijen[v.thema] || { naam: THEMA[v.thema] || v.thema, goed: 0, totaal: 0, href: `../thema.html?t=${MAP[v.thema]}&stap=b`, hrefNaam: `Herhaal de weetjes: ${THEMA[v.thema] || v.thema}` };
      r.totaal++; if (stand.antwoorden[i] === 0) r.goed++;
    });
    return App.perSoort(Object.values(rijen), 'Per thema');
  }
  if (!stand) welkom(); else if (stand.klaar) uitslag(); else examen();
})();
</script>
</body>
</html>
